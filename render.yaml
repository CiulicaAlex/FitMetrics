services:
  - type: web
    name: fitmetrics
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Sqlite
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/app/data/fitmetrics.db
